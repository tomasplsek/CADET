[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycadetds9"
version = "0.1.0"
description = "DS9 plugin and CLI integration for pycadet"
authors = [
    { name = "Tomas Plsek", email = "plsek@physics.muni.cz" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pycadet",
    "pyds9",
    "numpy>=1.8",
    "astropy>=1.3",
    "scipy>=0.14",
    "scikit-learn",
]

[project.urls]
"Homepage" = "https://github.com/tomasplsek/CADET"
"Repository" = "https://github.com/tomasplsek/CADET"

[project.scripts]
DS9CADET = "pycadetds9.ds9cadet:main"

[tool.setuptools]
packages = ["pycadetds9"]

[tool.setuptools.package-data]
pycadetds9 = ["DS9CADET.ds9.ans"]
